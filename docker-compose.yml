# ============================================
# PMS Docker Compose 服务编排
# 四川省甘孜监狱执法证据保全系统
# ============================================
# 使用方式:
#   启动: docker-compose --env-file .env.docker up -d
#   停止: docker-compose --env-file .env.docker down
#   日志: docker-compose --env-file .env.docker logs -f backend
# ============================================

services:
  # ============ MySQL 数据库 ============
  mysql:
    image: mysql:8.0
    container_name: pms-mysql
    restart: always
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pms_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pms}
      MYSQL_USER: ${MYSQL_USER:-pms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pms_db_2026}
      TZ: Asia/Shanghai
    volumes:
      # 数据持久化（升级时数据不丢失）
      - ${MYSQL_DATA_DIR:-./data/mysql}:/var/lib/mysql
      # 初始化SQL（仅首次启动执行，按文件名字母顺序）
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      # 基础系统SQL（固定序号，保证在业务表之前执行）
      - ./sql/ry_20260417.sql:/docker-entrypoint-initdb.d/01-ry-schema.sql
      - ./sql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql
      # 业务模块SQL（目录挂载，新增表文件放入 sql/pm/ 后自动执行，无需修改配置）
      - ./sql/pm:/docker-entrypoint-initdb.d
      # 备份文件挂载（方便还原操作）
      - ${BACKUP_DIR:-./data/backup}:/backup
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --init-connect='SET NAMES utf8mb4'
      --default-authentication-plugin=mysql_native_password
      --max-connections=500
      --innodb-buffer-pool-size=512M
      --lower-case-table-names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-pms_root_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pms-net

  # ============ Redis 缓存 ============
  redis:
    image: redis:7
    container_name: pms-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-pms_redis_2026}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      # Redis 数据持久化
      - ${REDIS_DATA_DIR:-./data/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-pms_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pms-net

  # ============ 后端服务 ============
  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    image: pms-backend:${PMS_VERSION:-v1.0.0}
    container_name: pms-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8}
      MYSQL_USER: ${MYSQL_USER:-pms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pms_db_2026}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pms_redis_2026}
      DRUID_USERNAME: ${DRUID_USERNAME:-admin}
      DRUID_PASSWORD: ${DRUID_PASSWORD:-pms_druid_2026}
    volumes:
      # 上传文件持久化
      - ${UPLOAD_DATA_DIR:-./data/upload}:/pms/uploadPath
      # 日志持久化
      - ${LOG_DATA_DIR:-./data/logs}:/pms/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pms-net

  # ============ 前端服务（Nginx） ============
  frontend:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: pms-frontend:${PMS_VERSION:-v1.0.0}
    container_name: pms-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - backend
    networks:
      - pms-net

# ============ 网络配置 ============
networks:
  pms-net:
    driver: bridge
    name: pms-net
